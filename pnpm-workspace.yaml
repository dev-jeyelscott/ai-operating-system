packages:
  - '.'

# Delay newly published versions before they become eligible for resolution.
minimumReleaseAge: 1440

# Permit only these explicitly reviewed security patches to bypass the
# one-day release-age delay.
minimumReleaseAgeExclude:
  - 'brace-expansion@1.1.18 || 5.0.9'
  - 'undici@7.29.0'
  - 'js-yaml@4.3.1'

# Reject Git, tarball, and other exotic transitive dependency sources.
blockExoticSubdeps: true

# Only explicitly reviewed packages may execute install-time build scripts.
allowBuilds:
  sharp: true
  unrs-resolver: true

publicHoistPattern:
  - '@inertiajs/core'

# Force vulnerable transitive ranges to their smallest patched releases.
overrides:
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@>=3.0.0 <3.3.17': 3.3.17
  sharp: 0.35.3
