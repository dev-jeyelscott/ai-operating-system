packages:
  - '.'

# Delay newly published versions before they become eligible for resolution.
minimumReleaseAge: 1440

# Reject Git, tarball, and other exotic transitive dependency sources.
blockExoticSubdeps: true

# Only explicitly reviewed packages may execute install-time build scripts.
allowBuilds:
  sharp: true
  unrs-resolver: true

publicHoistPattern:
  - '@inertiajs/core'

overrides:
  'minimatch@10.2.5>brace-expansion': 5.0.8

auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
