name: quality

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: 'false'
  APP_URL: http://127.0.0.1:8000
  APP_RELEASE: ci

  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: ai_operating_system_test
  DB_USERNAME: postgres
  DB_PASSWORD: postgres

  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379

  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: redis

  FILESYSTEM_DISK: local
  ARTIFACT_FILESYSTEM_DISK: local

  MAIL_MAILER: array
  BROADCAST_CONNECTION: log

  PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: 'postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15'
        env:
          POSTGRES_DB: ai_operating_system_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready -U postgres -d ai_operating_system_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: 'redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005'
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pinned container images
        run: |
          WWWUSER=1000 WWWGROUP=1000 \
            docker compose \
              --env-file .env.example \
              config \
              --quiet

          WWWUSER=1000 WWWGROUP=1000 \
            docker compose \
              --env-file .env.example \
              config \
              --images

          bash bin/check-container-images

      - name: Pull pinned infrastructure images
        run: |
          WWWUSER=1000 WWWGROUP=1000 \
            docker compose \
              --env-file .env.example \
              pull

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, pcntl, posix
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install PHP dependencies
        run: >
          composer install
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare application
        run: |
          cp .env.example .env
          sed -i "s/^APP_ENV=.*/APP_ENV=${APP_ENV}/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=${DB_DATABASE}/" .env
          php artisan key:generate
          php artisan migrate --force

      - name: Validate environment
        run: php artisan app:check

      - name: Validate production configuration rules
        run: php artisan test tests/Feature/Console/ProductionConfigurationValidatorTest.php

      - name: Run PostgreSQL concurrency suite
        run: |
          php artisan test \
            --testsuite=Concurrency \
            --fail-on-skipped \
            --fail-on-warning

      - name: Run supply-chain, backend, and frontend quality gates
        run: composer ci:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start application
        env:
          # Browser authentication spans multiple HTTP requests.
          SESSION_DRIVER: database
        run: |
          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > storage/logs/e2e-server.log 2>&1 &

          php artisan queue:work redis \
            --queue=default \
            --sleep=1 \
            --tries=1 \
            --timeout=120 \
            > storage/logs/e2e-queue.log 2>&1 &

          php artisan schedule:work \
            > storage/logs/e2e-scheduler.log 2>&1 &

          timeout 60 bash -c \
            'until curl --fail --silent http://127.0.0.1:8000/up > /dev/null; do sleep 2; done'

      - name: Run browser tests
        env:
          # Keep Artisan commands executed by Playwright aligned with the server.
          SESSION_DRIVER: database
        run: pnpm test:e2e

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            storage/logs/e2e-server.log
            storage/logs/e2e-queue.log
            storage/logs/e2e-scheduler.log
          if-no-files-found: ignore
